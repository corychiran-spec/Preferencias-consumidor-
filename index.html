<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#654735"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Restaurante XYZ"><title>Restaurante XYZ | Recomendador gastronómico</title><style>
:root{--c:#654735;--ct:#654735;--bg:#f7f5f1;--card:#fff;--ink:#26323a;--muted:#5f6b74;--line:#e6e5e1;--chip:#f1f2ef;--chipt:#58635e;--noteb:#f8f2e8;--notet:#79664d;--bord:#c9ccc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ct:color-mix(in srgb,var(--c) 40%,#fff);--bg:#14171a;--card:#1d2226;--ink:#e8eaeb;--muted:#a3adb4;--line:#2e353a;--chip:#2a3136;--chipt:#c2cacf;--noteb:#2b2820;--notet:#d6c7a8;--bord:#3d464c}}
:root[data-theme="dark"]{--ct:color-mix(in srgb,var(--c) 40%,#fff);--bg:#14171a;--card:#1d2226;--ink:#e8eaeb;--muted:#a3adb4;--line:#2e353a;--chip:#2a3136;--chipt:#c2cacf;--noteb:#2b2820;--notet:#d6c7a8;--bord:#3d464c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.choice input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.chead{background:var(--card);border-bottom:1px solid var(--line);padding:17px 5%}
.brand{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{background:var(--c);color:#fff;border-radius:12px;padding:12px;font-weight:bold;min-width:46px;text-align:center}
.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}
.cmain{max-width:900px;margin:28px auto;padding:0 16px}
.intro{text-align:center;margin:28px 0}
.intro small{color:var(--ct);font-weight:bold;letter-spacing:1.4px}
.intro h2{font-size:29px;margin:8px}
.intro p{color:var(--muted);font-size:14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 6px 22px #2c21100a}
.card h3{font-size:16px;margin:0 0 5px}
.sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.group{margin:20px 0}.group b{display:block;font-size:13px;margin-bottom:10px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}.choice input{position:absolute;opacity:0}
.choice span{display:block;border:1px solid var(--bord);border-radius:8px;padding:10px 13px;font-size:13px;cursor:pointer}
.choice input:checked+span{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:var(--c);color:var(--ct);font-weight:bold}
button{border:0;border-radius:8px;padding:12px 16px;font-weight:bold;font-size:13px;cursor:pointer;font-family:inherit}
.primary{background:var(--c);color:#fff}
.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
#cResults{display:none}#cResults.show{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dish{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.photo{height:110px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 35%,#fff),var(--c));display:grid;place-items:center;color:#fff;font-size:30px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:13px}.body h4{margin:0 0 7px;font-size:14px}
.body p{font-size:12px;color:var(--muted);line-height:1.5;min-height:48px;margin:0 0 8px}
.tag{display:inline-block;background:var(--chip);border-radius:20px;padding:4px 8px;font-size:11px;margin:2px;color:var(--chipt)}
.match{font-size:12px;font-weight:bold;color:var(--ct);margin-top:8px}
.price{font-size:12px;color:var(--ct);font-weight:bold;margin-top:4px}
.vacio{font-size:13px;color:var(--muted);line-height:1.6}
.note{font-size:12px;color:var(--notet);background:var(--noteb);padding:12px;border-radius:8px;line-height:1.5;margin-top:15px}
.footer{text-align:center;color:var(--muted);font-size:11px;margin:25px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.intro h2{font-size:24px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><div id="app"></div><script>window.APP_DATA={"nombre":"Restaurante XYZ","sub":"Recomendador gastronómico","intro":"Seleccione sus preferencias gastronómicas y conozca preparaciones del menú que podrían ajustarse a sus elecciones.","color":"#654735","platos":[{"n":"T-Bone","d":"Corte de res acompañado de papas, longaniza, ensalada y aderezos.","p":"res","s":"parrilla","g":"individual","t":"especialidad","i":"🥩","precio":"","foto":"","activo":true},{"n":"Picaña","d":"Corte de res a la parrilla con guarniciones y aderezos.","p":"res","s":"parrilla","g":"individual","t":"especialidad","i":"🥩","precio":"","foto":"","activo":true},{"n":"Lomo bife","d":"Corte de res acompañado de papas, longaniza, ensalada y aderezos.","p":"res","s":"parrilla","g":"individual","t":"especialidad","i":"🍽️","precio":"","foto":"","activo":true},{"n":"Tomahawk steak","d":"Corte grueso de res con hueso y acompañamientos.","p":"res","s":"parrilla","g":"individual","t":"especialidad","i":"🥩","precio":"","foto":"","activo":true},{"n":"Parrillada mixta","d":"Combinación de res, cerdo, pollo y embutidos con papas y ensalada.","p":"mixto","s":"parrilla","g":"grupo","t":"compartir","i":"🍖","precio":"","foto":"","activo":true},{"n":"Chuleta de cerdo","d":"Chuleta acompañada de papas a la francesa, ensalada y aderezos.","p":"cerdo","s":"parrilla","g":"individual","t":"tradicional","i":"🍖","precio":"","foto":"","activo":true},{"n":"Costillas ahumadas","d":"Costillas con salsa BBQ o buffalo, acompañadas de papas y ensalada.","p":"cerdo","s":"salsa","g":"individual","t":"especialidad","i":"🍖","precio":"","foto":"","activo":true},{"n":"Pechuga de pollo apanada","d":"Pechuga apanada acompañada de papas, ensalada y aderezos.","p":"pollo","s":"apanado","g":"individual","t":"tradicional","i":"🍗","precio":"","foto":"","activo":true},{"n":"Pollo a la parrilla","d":"Pechuga de pollo a la parrilla con acompañamientos.","p":"pollo","s":"parrilla","g":"individual","t":"tradicional","i":"🍗","precio":"","foto":"","activo":true},{"n":"Trucha frita","d":"Trucha acompañada de arroz, patacón, ensalada y aderezos.","p":"pescado","s":"apanado","g":"individual","t":"tradicional","i":"🐟","precio":"","foto":"","activo":true},{"n":"Camarones al ajillo","d":"Camarones preparados al ajillo con papas, ensalada y aderezos.","p":"mariscos","s":"salsa","g":"individual","t":"especialidad","i":"🍤","precio":"","foto":"","activo":true},{"n":"Brochetas mixtas","d":"Brochetas de pollo, res, cerdo o camarón, acompañadas de guarniciones.","p":"mixto","s":"parrilla","g":"dos","t":"compartir","i":"🍢","precio":"","foto":"","activo":true},{"n":"Veggie salad","d":"Ensalada con vegetales, aguacate, maíz y vinagreta.","p":"vegetariano","s":"cualquiera","g":"individual","t":"tradicional","i":"🥗","precio":"","foto":"","activo":true},{"n":"Picadita mixta","d":"Preparación para compartir con proteínas variadas, papas y ensalada.","p":"mixto","s":"parrilla","g":"grupo","t":"compartir","i":"🍽️","precio":"","foto":"","activo":true}]};

const PROT=[['res','Carne de res'],['cerdo','Carne de cerdo'],['pollo','Pollo'],['pescado','Pescado'],['mariscos','Mariscos'],['vegetariano','Vegetariano'],['mixto','Varias proteínas']];
const ESTILO=[['parrilla','A la parrilla'],['apanado','Apanado o frito'],['salsa','Con salsa']];
const PERS=[['individual','Una persona'],['dos','Dos personas'],['grupo','Tres o más personas']];
const PRIOR=[['tradicional','Plato tradicional'],['especialidad','Corte o especialidad'],['compartir','Para compartir']];
const SIN=['cualquiera','Sin preferencia'];
const PREGUNTAS=[
  {k:'p',t:'1. ¿Qué tipo de preparación prefiere?',o:PROT.concat([SIN])},
  {k:'s',t:'2. ¿Qué forma de preparación le resulta más atractiva?',o:ESTILO.concat([SIN])},
  {k:'g',t:'3. ¿Para cuántas personas busca una opción?',o:PERS.concat([SIN])},
  {k:'t',t:'4. ¿Qué desea priorizar?',o:PRIOR.concat([SIN])}
];
function seguro(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function etiqueta(lista,v){const f=lista.find(x=>x[0]===v);return f?f[1]:''}
function puntos(x,a){
  let n=0;
  if(a.p==="cualquiera"||x.p===a.p)n+=5;
  if(a.s==="cualquiera"||x.s===a.s||x.s==="cualquiera")n+=3;
  if(a.g==="cualquiera"||x.g===a.g||x.g==="cualquiera")n+=2;
  if(a.t==="cualquiera"||x.t===a.t)n+=2;
  return n;
}
function mountConsumer(root,data){
  const color=/^#[0-9a-f]{6}$/i.test(data.color)?data.color:'#654735';
  root.style.setProperty('--c',color);
  const siglas=(data.nombre||'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase()||'R';
  const form=PREGUNTAS.map(q=>`<div class="group"><b>${q.t}</b><div class="choices">${q.o.map(o=>`<label class="choice"><input required type="radio" name="${q.k}" value="${o[0]}"><span>${o[1]}</span></label>`).join('')}</div></div>`).join('');
  root.innerHTML=`
<div class="chead"><div class="brand"><div class="logo">${seguro(siglas)}</div><div><h1>${seguro(data.nombre)}</h1><small>${seguro(data.sub)}</small></div></div></div>
<main class="cmain">
<section class="intro"><small>MENÚ INTERACTIVO</small><h2>Encuentre una opción a su gusto</h2><p>${seguro(data.intro)}</p></section>
<section class="card"><h3>Cuéntenos qué prefiere</h3><div class="sub">Seleccione una alternativa en cada apartado.</div>
<form class="cform">${form}<div class="actions"><button class="primary" type="submit">Ver recomendaciones</button><button class="secondary" type="reset">Limpiar selección</button></div></form></section>
<section class="card" id="cResults" aria-live="polite"><h3>Opciones sugeridas para usted</h3><div class="sub">Las alternativas se ordenan según la coincidencia con sus preferencias.</div><div class="grid"></div><div class="note">Las sugerencias son orientativas. Consulte al personal sobre disponibilidad, ingredientes, posibles alérgenos y modificaciones antes de confirmar su pedido.</div><div class="actions"><button class="secondary cback" type="button">Cambiar preferencias</button></div></section>
<p class="footer">${seguro(data.nombre)} · Herramienta de orientación gastronómica</p>
</main>`;
  const f=root.querySelector('.cform'),res=root.querySelector('#cResults'),grid=root.querySelector('.grid');
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(f),pref={p:fd.get('p'),s:fd.get('s'),g:fd.get('g'),t:fd.get('t')};
    const lista=(data.platos||[]).filter(x=>x.activo!==false&&x.n)
      .map(x=>({x:x,sc:puntos(x,pref)})).filter(r=>r.sc>0)
      .sort((u,v)=>v.sc-u.sc).slice(0,3);
    grid.style.display=lista.length?'':'block';
    grid.innerHTML=lista.length?lista.map(r=>{
      const x=r.x,pct=Math.round(r.sc/12*100);
      const img=/^data:image\//.test(x.foto||'')?`<img src="${x.foto}" alt="${seguro(x.n)}">`:seguro(x.i||'🍽️');
      const tags=[etiqueta(PROT,x.p),etiqueta(ESTILO,x.s)].filter(Boolean).map(t=>`<span class="tag">${seguro(t)}</span>`).join('');
      return `<article class="dish"><div class="photo">${img}</div><div class="body"><h4>${seguro(x.n)}</h4><p>${seguro(x.d)}</p>${tags}<div class="match">Coincidencia: ${pct}%</div><div class="price">${x.precio?'Precio: '+seguro(x.precio):'Precio: consultar en el restaurante'}</div></div></article>`;
    }).join(''):'<p class="vacio">No encontramos platos que coincidan con esas preferencias. Consulte al personal para recibir una sugerencia.</p>';
    res.classList.add('show');
    res.scrollIntoView({behavior:'smooth'});
  });
  f.addEventListener('reset',()=>res.classList.remove('show'));
  root.querySelector('.cback').addEventListener('click',()=>f.scrollIntoView({behavior:'smooth'}));
}

mountConsumer(document.getElementById("app"),window.APP_DATA);</script><script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){})})}</script></body></html>
